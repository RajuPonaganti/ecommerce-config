payment:
  gateway:
    base-url: http://localhost:8080
    api-key: pgw_test_ecomm_abc123xyz789
    api-secret: ecomm_secret_do_not_use_in_prod
    merchant-id: MERCH_ECOMM_001
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      paymentGateway:
        max-attempts: 2
        wait-duration: 2s
        retry-exceptions:
          - com.ecommerce.payment.exception.PaymentGatewayUnavailableException
        ignore-exceptions:
          - com.ecommerce.payment.exception.PaymentDeclinedException
          - com.ecommerce.payment.exception.PaymentGatewayAuthException
eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus  # explicit allowlist, not "*"
  endpoint:
    health:
      show-details: when-authorized   # don't leak DB/disk details to anonymous callers
  tracing:
    sampling:
      probability: 0.1   # lower in prod, as discussed
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans    
logging:
  level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"
    root: WARN
    com.ecommerce.payment: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN    
server:
  port: 8087
spring: 
  datasource:
    url: jdbc:postgresql://localhost:5432/ecomm_payment_service_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: true
        spring.json.trusted.packages: "com.ecommerce.commons"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

